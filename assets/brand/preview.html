<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@400&display=swap" rel="stylesheet">
<style>
body{margin:0;display:grid;grid-template-columns:1fr 1fr;font-family:Inter,sans-serif}
.p{height:420px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
.light{background:#efe8dc;color:#2b2620}.dark{background:#1f1c18;color:#efe8dc}
.sym{width:64px;height:64px}
.word{font-family:'Cormorant Garamond',serif;font-size:64px;letter-spacing:.32em;margin-right:-.32em;line-height:1}
.sub{font-size:11px;letter-spacing:.45em;text-transform:uppercase;opacity:.7;margin-right:-.45em}
.row{display:flex;align-items:center;gap:18px}.row .sym{width:34px;height:34px}.row .word{font-size:34px}
</style></head><body>
<div class="p light"><div class="sym"><svg width="100%" height="100%" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <g fill="currentColor">
    <circle cx="20" cy="20" r="3.2"/>
    <g id="ray"><path d="M20 0C22.6 4.6 22.9 9.6 20 14.6C17.1 9.6 17.4 4.6 20 0Z"/></g>
    <use href="#ray" transform="rotate(90 20 20)"/>
    <use href="#ray" transform="rotate(180 20 20)"/>
    <use href="#ray" transform="rotate(270 20 20)"/>
    <g id="leaf"><path d="M20 6.4C21.5 9 21.6 11.6 20 14.2C18.4 11.6 18.5 9 20 6.4Z"/></g>
    <use href="#leaf" transform="rotate(45 20 20)"/>
    <use href="#leaf" transform="rotate(135 20 20)"/>
    <use href="#leaf" transform="rotate(225 20 20)"/>
    <use href="#leaf" transform="rotate(315 20 20)"/>
  </g>
</svg>
</div><div class="word">SOLE</div><div class="sub">Residence · Coconut Grove</div></div>
